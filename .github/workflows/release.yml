name: Signed Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require signed-release credentials and completed validation
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPROVED: ${{ vars.RELEASE_VALIDATION_APPROVED }}
        run: |
          test "$GITHUB_REF_NAME" = 'v0.1' || { echo 'Unexpected version tag'; exit 1; }
          test "$APPROVED" = 'true' || { echo 'Blocker: device, Instagram and InstaPro validation approval is missing.'; exit 1; }
          test -n "$KEYSTORE" && test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" || { echo 'Blocker: secure Android signing credentials are missing.'; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Align, sign, verify and record size/hash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          tools="$ANDROID_HOME/build-tools/36.0.0"
          keyfile="$RUNNER_TEMP/insfollow-release.jks"
          trap 'rm -f "$keyfile"' EXIT
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$keyfile"
          "$tools/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out InsFollow-0.1.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose InsFollow-0.1.apk
          python3 scripts/verify_apk.py InsFollow-0.1.apk
          sha256sum InsFollow-0.1.apk > InsFollow-0.1.apk.sha256
          stat --printf='APK size: %s bytes\n' InsFollow-0.1.apk > release-notes.txt
          cat docs/RELEASE_NOTES_0.1.md >> release-notes.txt
          cat InsFollow-0.1.apk.sha256 >> release-notes.txt
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" InsFollow-0.1.apk InsFollow-0.1.apk.sha256 --verify-tag --title 'InsFollow 0.1' --notes-file release-notes.txt
