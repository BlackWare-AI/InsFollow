name: Publish device-test debug APK
on:
  push:
    branches: [feat/insfollow-0.1]
    paths: [.github/workflows/debug-release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify and publish development APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk InsFollow-0.1-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify InsFollow-0.1-debug.apk
          python3 scripts/verify_apk.py InsFollow-0.1-debug.apk
          sha256sum InsFollow-0.1-debug.apk > InsFollow-0.1-debug.apk.sha256
          cat > debug-notes.md <<'NOTES'
          Development APK for manual device testing of InsFollow 0.1. Requires Android 14+.

          Signed with a development/debug key. This prerelease is separate from production v0.1. Future builds may use a different signing key and require uninstalling; export an application backup before uninstalling.

          User-assisted follow workflow only. Collapsing the browser or leaving the Activity pauses processing. Live Instagram, physical-device lifecycle and target InstaPro import compatibility remain unverified. Never post credentials, cookies or private account lists in public bug reports.
          NOTES
          printf '\nSource commit: %s\n' "$GITHUB_SHA" >> debug-notes.md
          stat --printf='APK size: %s bytes\n' InsFollow-0.1-debug.apk >> debug-notes.md
          cat InsFollow-0.1-debug.apk.sha256 >> debug-notes.md
          gh release create debug-0.1-1 InsFollow-0.1-debug.apk InsFollow-0.1-debug.apk.sha256 --target "$GITHUB_SHA" --prerelease --latest=false --title 'InsFollow 0.1 Debug — device testing' --notes-file debug-notes.md
