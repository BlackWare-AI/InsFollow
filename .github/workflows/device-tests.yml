name: Android emulator tests
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop ai.blackware.insfollow
            adb shell am start -W -n ai.blackware.insfollow/.ui.MainActivity > startup-api-${{ matrix.api }}.txt
            python3 -c "from pathlib import Path; text = Path('startup-api-${{ matrix.api }}.txt').read_text(); print(text); assert 'Status: ok' in text, 'Startup failed'"
            adb shell dumpsys webviewupdate > webview-api-${{ matrix.api }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            startup-api-*.txt
            webview-api-*.txt
